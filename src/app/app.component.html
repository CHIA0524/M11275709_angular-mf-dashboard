<div class="dashboard-shell">
  <aside class="dashboard-sidebar">
    <div class="dashboard-brand">
      <mat-icon class="brand-icon">dashboard</mat-icon>
      <div>
        <h1>Dashboard</h1>
        <p>獨立微前端預覽</p>
      </div>
    </div>

    <div class="dashboard-sidebar-card">
      <div class="sidebar-card-label">目前模式</div>
      <div class="sidebar-card-value">Standalone Remote</div>
    </div>

    <div class="dashboard-facts">
      @for (fact of quickFacts; track fact.label) {
        <div class="dashboard-fact">
          <mat-icon>{{ fact.icon }}</mat-icon>
          <span>{{ fact.label }}</span>
        </div>
      }
    </div>
  </aside>

  <section class="dashboard-main">
    <mat-toolbar class="dashboard-toolbar">
      <span class="toolbar-title">財務管理系統</span>
      <span class="toolbar-subtitle">Dashboard 模組</span>
    </mat-toolbar>

    <main class="dashboard-content">
      <router-outlet></router-outlet>
    </main>
  </section>
</div>
